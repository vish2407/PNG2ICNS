<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac Icon Creator</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<header class="shell-header">
  <div class="shell-header__left">
    <span class="shell-header__product">Mac Icon Creator</span>
  </div>
  <div class="shell-header__right">
    <span class="shell-header__tag">Customize and create your own macOS icons</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="4" width="32" height="32" rx="8" fill="#0f62fe"/>
          <rect x="10" y="12" width="20" height="16" rx="1.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
          <circle cx="14.5" cy="16.5" r="1.5" fill="white" opacity="0.9"/>
          <polyline points="10,28 16,20 20.5,23.5 25,18 30,28" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="title">Mac Icon Creator</div>
        <div class="subtitle">squircle · 82% canvas · centroid detect · 11 sizes</div>
      </div>
    </div>

    <div class="drop-zone" id="drop-zone">
      <span class="drop-icon">⬆️</span>
      <div class="drop-label">Drop PNG files here</div>
      <div class="drop-sub">or click to select · multiple files supported</div>
      <input type="file" id="file-input" accept="image/png" multiple>
    </div>

    <div class="batch-list" id="batch-list"></div>

    <div class="preview-wrap" id="preview-wrap">
      <img class="preview-thumb" id="preview-thumb" src="" alt="">
      <div class="preview-info">
        <div class="preview-name" id="preview-name"></div>
        <div class="preview-size" id="preview-size"></div>
      </div>
      <button class="clear-btn" id="clear-btn" title="Remove">✕</button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">Processing…</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <button class="convert-btn" id="convert-btn">Convert &amp; Save to Downloads</button>
  </div>
</main>

<footer class="shell-footer">
  <span>Your files stay on your machine — no uploads, no cloud.</span>
  <span class="shell-footer__right">Made with ❤️ by Vishnu</span>
</footer>

<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon"></span>
  <span id="toast-msg"></span>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
