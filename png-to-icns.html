<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG → ICNS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0e0e10;
    --surface:  #18181c;
    --border:   #2a2a30;
    --accent:   #7c6cfc;
    --accent2:  #c084fc;
    --success:  #34d399;
    --error:    #f87171;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --radius:   18px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Ambient glow behind card */
  body::before {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,108,252,.12) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    position: relative;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .logo {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

  /* Drop zone */
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    background: rgba(255,255,255,.015);
  }

  .drop-zone:hover, .drop-zone.hover {
    border-color: var(--accent);
    background: rgba(124,108,252,.06);
  }

  .drop-zone.hover { transform: scale(1.01); }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 14px;
    display: block;
    transition: transform 0.2s;
  }
  .drop-zone:hover .drop-icon { transform: translateY(-3px); }

  .drop-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }

  .drop-sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  #file-input { display: none; }

  /* Preview strip */
  .preview-wrap {
    display: none;
    gap: 12px;
    margin-top: 20px;
    align-items: center;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }

  .preview-wrap.visible { display: flex; }

  .preview-thumb {
    width: 52px; height: 52px;
    border-radius: 10px;
    object-fit: cover;
    background: #111;
    flex-shrink: 0;
  }

  .preview-info { flex: 1; min-width: 0; }
  .preview-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-size { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

  .clear-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; padding: 4px;
    border-radius: 6px; transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--error); }

  /* Convert button */
  .convert-btn {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    display: none;
    letter-spacing: -0.2px;
  }

  .convert-btn.visible { display: block; }
  .convert-btn:hover { opacity: .9; transform: translateY(-1px); }
  .convert-btn:active { transform: translateY(0); }
  .convert-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Progress */
  .progress-wrap {
    display: none;
    margin-top: 20px;
    gap: 8px;
    flex-direction: column;
  }
  .progress-wrap.visible { display: flex; }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    display: flex; justify-content: space-between;
  }

  .progress-bar-bg {
    height: 4px; border-radius: 99px;
    background: var(--border); overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%; transition: width 0.3s ease;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: all 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success .toast-icon { color: var(--success); }
  .toast.error .toast-icon { color: var(--error); }
  .toast-icon { font-size: 16px; }

  /* Settings row */
  .settings {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .setting-label { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; }

  .badge {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    background: rgba(124,108,252,.15);
    color: var(--accent2);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(124,108,252,.2);
  }

  /* Batch list */
  .batch-list {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .batch-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
  }

  .batch-item .bi-name { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .batch-item .bi-status { font-size: 14px; }
  .bi-status.done { color: var(--success); }
  .bi-status.working { color: var(--accent); animation: pulse 1s infinite; }
  .bi-status.waiting { color: var(--border); }
  .bi-status.error { color: var(--error); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">🎨</div>
    <div>
      <div class="title">PNG → ICNS</div>
      <div class="subtitle">macOS icon converter</div>
    </div>
  </div>

  <div class="drop-zone" id="drop-zone">
    <span class="drop-icon">⬆️</span>
    <div class="drop-label">Drop PNG files here</div>
    <div class="drop-sub">or click to select · multiple files supported</div>
    <input type="file" id="file-input" accept="image/png" multiple>
  </div>

  <div class="batch-list" id="batch-list"></div>

  <div class="preview-wrap" id="preview-wrap">
    <img class="preview-thumb" id="preview-thumb" src="" alt="">
    <div class="preview-info">
      <div class="preview-name" id="preview-name"></div>
      <div class="preview-size" id="preview-size"></div>
    </div>
    <button class="clear-btn" id="clear-btn" title="Remove">✕</button>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Processing…</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <button class="convert-btn" id="convert-btn">Convert &amp; Save to Downloads</button>

  <div class="settings">
    <span class="setting-label">squircle · 82% canvas · centroid detect</span>
    <span class="badge">11 sizes</span>
  </div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon"></span>
  <span id="toast-msg"></span>
</div>

<script>
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const previewWrap= document.getElementById('preview-wrap');
const previewThumb=document.getElementById('preview-thumb');
const previewName= document.getElementById('preview-name');
const previewSize= document.getElementById('preview-size');
const clearBtn   = document.getElementById('clear-btn');
const convertBtn = document.getElementById('convert-btn');
const progressWrap=document.getElementById('progress-wrap');
const progressText=document.getElementById('progress-text');
const progressPct= document.getElementById('progress-pct');
const progressFill=document.getElementById('progress-fill');
const batchList  = document.getElementById('batch-list');
const toast      = document.getElementById('toast');

let pendingFiles = [];

// ── Drop zone interactions ──
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('hover');
  const files = [...e.dataTransfer.files].filter(f => f.type === 'image/png');
  if (files.length) handleFiles(files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFiles([...fileInput.files]);
});
clearBtn.addEventListener('click', reset);

function handleFiles(files) {
  pendingFiles = files;
  batchList.innerHTML = '';

  if (files.length === 1) {
    // Single file preview
    const f = files[0];
    const url = URL.createObjectURL(f);
    previewThumb.src = url;
    previewName.textContent = f.name;
    previewSize.textContent = (f.size / 1024).toFixed(1) + ' KB · PNG';
    previewWrap.classList.add('visible');
  } else {
    previewWrap.classList.remove('visible');
    // Batch list
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'batch-item';
      item.id = `batch-${i}`;
      item.innerHTML = `<span class="bi-status waiting" id="bs-${i}">○</span><span class="bi-name">${f.name}</span>`;
      batchList.appendChild(item);
    });
  }

  convertBtn.classList.add('visible');
  progressWrap.classList.remove('visible');
  setProgress(0, '');
}

function reset() {
  pendingFiles = [];
  previewWrap.classList.remove('visible');
  convertBtn.classList.remove('visible');
  progressWrap.classList.remove('visible');
  batchList.innerHTML = '';
  fileInput.value = '';
  previewThumb.src = '';
}

// ── Conversion ──
convertBtn.addEventListener('click', async () => {
  if (!pendingFiles.length) return;
  convertBtn.disabled = true;
  progressWrap.classList.add('visible');

  for (let i = 0; i < pendingFiles.length; i++) {
    const f = pendingFiles[i];
    const statusEl = document.getElementById(`bs-${i}`);
    if (statusEl) { statusEl.textContent = '◉'; statusEl.className = 'bi-status working'; }

    try {
      const img = await loadImage(f);
      const bounds = detectBounds(img);
      const icns = await buildICNS(img, bounds, (step, total) => {
        const overall = (i / pendingFiles.length) + (step / total / pendingFiles.length);
        setProgress(Math.round(overall * 100), `${f.name} · size ${step}/${total}`);
      });

      const stem = f.name.replace(/\.png$/i, '');
      downloadBlob(icns, `${stem}.icns`);
      if (statusEl) { statusEl.textContent = '✓'; statusEl.className = 'bi-status done'; }
    } catch(err) {
      if (statusEl) { statusEl.textContent = '✕'; statusEl.className = 'bi-status error'; }
      showToast('error', `❌ Failed: ${f.name}`);
    }
  }

  setProgress(100, 'Done');
  showToast('success', `✓ Saved ${pendingFiles.length} icon${pendingFiles.length>1?'s':''} to Downloads`);
  convertBtn.disabled = false;
});

function setProgress(pct, label) {
  progressFill.style.width = pct + '%';
  progressPct.textContent  = pct + '%';
  progressText.textContent = label || 'Processing…';
}

// ── Image helpers ──
function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function detectBounds(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, img.width, img.height).data;
  let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      const i = (y * img.width + x) * 4;
      if (d[i] > 30 || d[i+1] > 30 || d[i+2] > 30) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  return { minX, maxX, minY, maxY };
}

function renderSize(img, canvasSize, bounds) {
  const inset = 8;
  const { minX, maxX, minY, maxY } = bounds;
  const cx   = Math.floor((minX + inset + maxX - inset) / 2);
  const cy   = Math.floor((minY + inset + maxY - inset) / 2);
  const half = Math.floor(Math.max(maxX - minX - inset*2, maxY - minY - inset*2) / 2);

  const sqSize = Math.floor(canvasSize * 0.82);
  const sqOff  = Math.floor((canvasSize - sqSize) / 2);
  const radius  = sqSize * 0.2237;

  // Draw into squircle canvas
  const sqC = document.createElement('canvas');
  sqC.width = sqC.height = sqSize;
  const sqCtx = sqC.getContext('2d');

  // Clip to squircle
  sqCtx.beginPath();
  sqCtx.roundRect(0, 0, sqSize, sqSize, radius);
  sqCtx.clip();

  // Draw image
  sqCtx.drawImage(img, cx - half, cy - half, half * 2, half * 2, 0, 0, sqSize, sqSize);

  // Final canvas
  const fc = document.createElement('canvas');
  fc.width = fc.height = canvasSize;
  const fctx = fc.getContext('2d');
  fctx.drawImage(sqC, sqOff, sqOff);

  return new Promise(res => fc.toBlob(res, 'image/png'));
}

const ICON_TYPES = [
  { type: 'icp4', size: 16  },
  { type: 'ic11', size: 32  },
  { type: 'icp5', size: 32  },
  { type: 'ic12', size: 64  },
  { type: 'icp6', size: 64  },
  { type: 'ic07', size: 128 },
  { type: 'ic13', size: 256 },
  { type: 'ic08', size: 256 },
  { type: 'ic14', size: 512 },
  { type: 'ic09', size: 512 },
  { type: 'ic10', size: 1024},
];

async function buildICNS(img, bounds, onProgress) {
  const chunks = [];
  for (let i = 0; i < ICON_TYPES.length; i++) {
    const { type, size } = ICON_TYPES[i];
    onProgress(i + 1, ICON_TYPES.length);
    const blob = await renderSize(img, size, bounds);
    const buf  = await blob.arrayBuffer();
    const png  = new Uint8Array(buf);
    const chunk = new Uint8Array(8 + png.length);
    for (let j = 0; j < 4; j++) chunk[j] = type.charCodeAt(j);
    const len = 8 + png.length;
    chunk[4]=(len>>24)&0xff; chunk[5]=(len>>16)&0xff;
    chunk[6]=(len>>8)&0xff;  chunk[7]=len&0xff;
    chunk.set(png, 8);
    chunks.push(chunk);
  }
  const bodyLen = chunks.reduce((s,c) => s + c.length, 0);
  const fileLen = 8 + bodyLen;
  const file = new Uint8Array(fileLen);
  // 'icns' magic
  file[0]=0x69; file[1]=0x63; file[2]=0x6e; file[3]=0x73;
  file[4]=(fileLen>>24)&0xff; file[5]=(fileLen>>16)&0xff;
  file[6]=(fileLen>>8)&0xff;  file[7]=fileLen&0xff;
  let off = 8;
  for (const c of chunks) { file.set(c, off); off += c.length; }
  return file;
}

function downloadBlob(data, filename) {
  const blob = new Blob([data], { type: 'image/x-icns' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ── Toast ──
let toastTimer;
function showToast(type, msg) {
  toast.className = `toast ${type}`;
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}
</script>
</body>
</html>
